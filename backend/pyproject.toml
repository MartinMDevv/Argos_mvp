[project]
name = "argos-backend"
version = "0.1.0"
description = "Backend de Argos — inteligencia de mercado cripto"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",      # framework web async
    "uvicorn[standard]>=0.32",  # servidor ASGI que corre la app
    "asyncpg>=0.30",       # driver async de Postgres/TimescaleDB (con pool propio)
    "pydantic-settings>=2.6",  # carga la configuración desde el .env y la valida
    "websockets>=14",     # cliente WebSocket async (ingesta en vivo de Binance)
    "httpx>=0.28",        # cliente HTTP async (backfill de historia desde la REST de Binance)
]

# Dependencias que solo hacen falta para desarrollar, no para correr Argos.
# `uv run pytest` las instala solo la primera vez.
[dependency-groups]
dev = [
    "pytest>=8.3",        # las pruebas de pruebas/ (paso 3.1)
]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
# Para que las pruebas puedan hacer `from app...` sin instalar el paquete.
pythonpath = ["."]
